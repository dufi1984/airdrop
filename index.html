<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Strict Cache-Busting Headers for PWA / iOS Safari / Android Chrome -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Apple WebApp / PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Airdrop by Dufi" />

    <meta name="theme-color" content="#121214" />
    <meta name="description" content="Közvetlen P2P fájlküldés és képmegosztás eszközök között." />
    <title>Airdrop by Dufi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Guarded Background Reload Script -->
    <script>
      // Reload when reopening app ONLY IF NO FILES ARE QUEUED OR RECEIVED
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          if (window.__airdrop_has_files_queued || window.__airdrop_has_received_files) return;

          var lastReload = sessionStorage.getItem('last_pwa_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload) > 30000) {
            sessionStorage.setItem('last_pwa_reload', now.toString());
            window.location.reload(true);
          }
        }
      });
    </script>
  </head>
  <body class="bg-[#121214] text-zinc-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
