<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%236366f1%22/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Strict Cache-Busting Headers for PWA / iOS Safari / Android Chrome -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Apple WebApp / PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Airdrop by Dufi" />

    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Közvetlen P2P fájlküldés és képmegosztás eszközök között." />
    <title>Airdrop by Dufi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Automatic Pull-to-Refresh & Guarded Background Reload Script -->
    <script>
      // 1. Reload when reopening app ONLY IF NO FILES ARE QUEUED (prevents clearing queued photos)
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          if (window.__airdrop_has_files_queued) return;

          var lastReload = sessionStorage.getItem('last_pwa_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload) > 15000) {
            sessionStorage.setItem('last_pwa_reload', now.toString());
            window.location.reload(true);
          }
        }
      });

      // 2. Explicit Pull-to-Refresh gesture (swiping down from top)
      let touchStartY = 0;
      document.addEventListener('touchstart', function(e) {
        if (window.scrollY === 0) {
          touchStartY = e.touches[0].pageY;
        }
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        var currentY = e.touches[0].pageY;
        if (window.scrollY === 0 && currentY - touchStartY > 130) {
          window.location.reload(true);
        }
      }, { passive: true });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
